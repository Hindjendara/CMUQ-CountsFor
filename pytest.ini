# Run from the repo root: python -m pytest
# backend/tests imports the "backend" package (it has __init__.py files, so its
# modules are backend.tests.test_*). backend/scraper/tests has no __init__.py: its
# conftest puts backend/scraper/ on sys.path and the pipeline scripts are imported
# as top-level modules. The two trees use different file names, so nothing collides.
[pytest]
testpaths = backend/tests backend/scraper/tests
