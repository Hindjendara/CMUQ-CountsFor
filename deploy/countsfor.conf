# Apache site for https://countsfor.qatar.cmu.edu (Ubuntu 24.04, Apache 2.4).
#
#   /                 static site: /var/www/html/countsfor/frontend
#   /api/...          the Flask API, Gunicorn on 127.0.0.1:8000 (deploy/countsfor-api.service)
#   http://...        permanent redirect to https://
#
# Install:
#   sudo a2enmod ssl proxy proxy_http headers rewrite deflate http2
#   sudo install -m 644 deploy/countsfor.conf /etc/apache2/sites-available/countsfor.conf
#   sudo editor /etc/apache2/sites-available/countsfor.conf   # replace the CHANGE_ME certificate names
#   sudo a2ensite countsfor
#   sudo a2dissite 000-default default-ssl   # 000-default serves all of /var/www/html, backend/ included
#   sudo apachectl configtest && sudo systemctl reload apache2
# Also worth setting server-wide in /etc/apache2/conf-available/security.conf:
#   ServerTokens Prod, ServerSignature Off, TraceEnable Off.
#
# Files: Apache (www-data) only needs to read frontend/. The daily scraper (user
# countsfor) rewrites frontend/data/courses.json, courses.json.gz and
# requirement_buckets.json in place.

# ── Server-wide: never serve the deploy root outside frontend/ ──────────────
# Applies to every vhost, so even a re-enabled 000-default (DocumentRoot
# /var/www/html) cannot serve backend/ (Python code, the private soc.json and
# faculty directory, the virtual environment).
<Directory /var/www/html/countsfor>
    Require all denied
</Directory>
<Directory /var/www/html/countsfor/backend>
    Require all denied
</Directory>

# ── HTTP: redirect everything to HTTPS ──────────────────────────────────────
<VirtualHost *:80>
    ServerName countsfor.qatar.cmu.edu
    # Keeps the path and the query string (password reset links carry ?token=).
    Redirect permanent / https://countsfor.qatar.cmu.edu/
    ErrorLog  ${APACHE_LOG_DIR}/countsfor_error.log
    CustomLog ${APACHE_LOG_DIR}/countsfor_access.log combined
</VirtualHost>

# ── HTTPS ───────────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName countsfor.qatar.cmu.edu
    DocumentRoot /var/www/html/countsfor/frontend
    DirectoryIndex index.html
    <IfModule mod_http2.c>
        Protocols h2 http/1.1
    </IfModule>

    SSLEngine on
    # CHANGE_ME: the certificate and key are in /etc/apache2; put their real
    # file names here (ls /etc/apache2). Apache will not start until they exist.
    SSLCertificateFile    /etc/apache2/CHANGE_ME_countsfor_cert.pem
    SSLCertificateKeyFile /etc/apache2/CHANGE_ME_countsfor_key.pem
    # CHANGE_ME, only if the certificate file does not already contain the
    # intermediate chain (Apache 2.4.8+ reads the chain from the cert file):
    # SSLCertificateChainFile /etc/apache2/CHANGE_ME_countsfor_chain.pem

    <Directory /var/www/html/countsfor/frontend>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /var/www/html/countsfor/frontend/data>
        # courses.json.gz is the catalog itself, gzip-encoded (see Compression).
        # Drop any global .gz type or encoding so only the rules below apply.
        RemoveType .gz
        RemoveEncoding .gz
    </Directory>

    # ── Files that must never be served ─────────────────────────────────────
    # The deploy excludes them, but a stray copy must still not be readable.
    # JS tests (frontend/tests/ in the repo):
    <LocationMatch "^/tests(/|$)">
        Require all denied
    </LocationMatch>
    # Dotfiles and dot-folders (.git, .env, .DS_Store ...), except ACME's .well-known:
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>
    # Source, notes, environment files, backups (the daily update's .prev
    # copies too) and editor leftovers:
    <FilesMatch "(\.(md|py|pyc|sh|env|example|ini|cfg|log|bak|prev|orig|swp|tmp|sql|dump)|~)$">
        Require all denied
    </FilesMatch>

    # ── Flask API (Gunicorn on 127.0.0.1:8000) ──────────────────────────────
    # /api is NOT stripped: every Flask blueprint registers its routes under
    # /api/... (url_prefix in backend/*.py), so /api/x goes to :8000/api/x.
    ProxyRequests     Off
    ProxyPreserveHost On
    # Above gunicorn's --timeout 120, so gunicorn times out first and Apache
    # passes its error on instead of cutting the request.
    ProxyTimeout      130
    # retry=0: after `systemctl restart countsfor-api`, use the backend again at
    # once instead of answering 503 for 60 seconds.
    ProxyPass         /api/ http://127.0.0.1:8000/api/ retry=0
    ProxyPassReverse  /api/ http://127.0.0.1:8000/api/
    # Gunicorn (--forwarded-allow-ips 127.0.0.1) and Flask (TRUST_PROXY=1, which
    # reads X-Forwarded-For and X-Forwarded-Proto) take the client address and the
    # https scheme from these. Apache appends X-Forwarded-For itself.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    <Location /api/>
        # Signed-in data: never stored by the browser or a shared cache.
        # A proxied answer keeps the backend's own headers in the normal table,
        # which "always" does not replace, so unset the backend's Cache-Control
        # first; otherwise the browser gets two Cache-Control headers.
        Header unset Cache-Control
        Header always set Cache-Control "no-store"
    </Location>

    # /health (not under /api) reports the database host and errors, so it is
    # not public. Check it on the server: curl -s http://127.0.0.1:8000/health
    # To let campus monitoring reach it, uncomment and set its address range:
    # <Location /health>
    #     ProxyPass http://127.0.0.1:8000/health retry=0
    #     Require local
    #     Require ip CHANGE_ME_MONITORING_RANGE
    # </Location>

    # ── Caching ─────────────────────────────────────────────────────────────
    # HTML, JS, CSS and JSON data: the browser keeps a copy but asks every time
    # (ETag / Last-Modified, so an unchanged file costs a 304). A new deploy or
    # the daily catalog update shows up on the next load.
    <FilesMatch "\.(html|js|css|json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    # Images change rarely and are not used for data: cache for 30 days.
    <FilesMatch "\.(png|jpe?g|gif|svg|ico|webp|woff2?)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>

    # ── Compression ─────────────────────────────────────────────────────────
    # 1) Precompressed catalog. The scraper (backend/scraper/update_data.py)
    #    writes frontend/data/courses.json.gz next to courses.json (about 30 MB
    #    down to about 1.2 MB). A client that accepts gzip gets the .gz file
    #    as-is: no gzip of 30 MB per request, and the file keeps a plain ETag,
    #    so revalidation still answers 304 (mod_deflate would add "-gzip" to it).
    #    Any other X.json with an X.json.gz beside it is served the same way.
    RewriteEngine On
    RewriteCond %{HTTP:Accept-Encoding} \bgzip\b
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.gz -f
    RewriteRule ^(/.+)\.json$ $1.json.gz [E=no-gzip:1,PT,L]
    <FilesMatch "\.json\.gz$">
        # The body is JSON, sent gzip-encoded; the browser decodes it.
        ForceType application/json
        Header set Content-Encoding gzip
        Header merge Vary Accept-Encoding
        Header set Cache-Control "no-cache"
        # Never gzip it a second time.
        SetEnv no-gzip 1
    </FilesMatch>
    # The same URL answers with or without gzip, so caches must key on it.
    <FilesMatch "\.json$">
        Header merge Vary Accept-Encoding
    </FilesMatch>
    # 2) Everything else that is text is compressed on the fly (small files).
    #    If courses.json.gz is missing, courses.json falls back to this too.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json image/svg+xml
    </IfModule>

    # ── Security headers ────────────────────────────────────────────────────
    # Port 80 already sends everyone here, so HSTS adds no new risk. The
    # host alone: no includeSubDomains, which would bind all of qatar.cmu.edu.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "frame-ancestors 'self'"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
    # Not set on purpose: Cross-Origin-Opener-Policy (can break the Google
    # sign-in popup) and a full script CSP (the pages use inline scripts and
    # load Google's sign-in client).

    ErrorLog  ${APACHE_LOG_DIR}/countsfor_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/countsfor_ssl_access.log combined
</VirtualHost>
