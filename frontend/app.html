<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CountsFor: understand what every CMU-Q course counts for across CS, IS, Business, and Biology majors." />
  <meta name="theme-color" content="#C41230" />
  <title>CountsFor: CMU-Q Curriculum Explorer</title>
  <link rel="icon" type="image/png" href="assets/img/scotty-standing.png" />
  <link rel="apple-touch-icon" href="assets/img/scotty-standing.png" />
  <meta name="cf-build" content="release-2026-11-20e" />
  <link rel="stylesheet" href="css/styles.css?v=release-2026-11-20e" />
  <!-- Start the catalog download with the page, not after sign-in: on a slow or
       distant connection it then overlaps loading the scripts and GET /api/me.
       Each href must equal what _bundledDataUrl() in js/api.js builds (the path
       plus the cf-build tag), or the browser downloads the file twice.
       scripts/bump_cf_build.py moves the tags together, and
       tests/app-views.test.js checks them. Keep the version query text out of
       this comment: the bump script rewrites every occurrence of it. The 1 MB
       catalog is low priority, so on a narrow connection the scripts still come
       first and the catalog uses the time the page waits for GET /api/me. -->
  <link rel="preload" href="data/courses.json?v=release-2026-11-20e" as="fetch" crossorigin="anonymous" fetchpriority="low" />
  <link rel="preload" href="data/minors.json?v=release-2026-11-20e" as="fetch" crossorigin="anonymous" />
  <!-- The API is called on this page's own origin (/api/..., see js/api.js). -->
  <!-- Google OAuth web client ID. Its Authorized JavaScript origins must list
       every origin that serves this page. -->
  <meta name="cf-google-client-id" content="378923997481-bgnvhg3gsgka5ptijjjsb80q4k7kc2vg.apps.googleusercontent.com" />
  <!-- Google Identity Services. REQUIRED for "Continue with Google" — without
       it window.google never loads and the sign-in button silently does nothing. -->
</head>
<body>
  <div id="app">
    <div class="empty-state" style="height:100vh">
      <div class="spinner"></div>
      <div class="empty-text" style="margin-top:12px">Loading CountsFor…</div>
    </div>
  </div>
  <script src="js/utils.js?v=release-2026-11-20e"></script>
  <script src="js/data.js?v=release-2026-11-20e"></script>
  <script src="js/profile.js?v=release-2026-11-20e"></script>
  <script src="js/api.js?v=release-2026-11-20e"></script>
  <script src="js/app.js?v=release-2026-11-20e"></script>
</body>
</html>
